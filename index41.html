<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StockLedger</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#ffffff">
<style>
:root{--bg:#f3f5f8;--fld:#ffffff;--sf:#ffffff;--ink:#0f172a;--mu:#64748b;--ln:#e2e8f0;--ac:#2456d8;--ai:#ffffff;--bad:#dc2626;--warn:#b45309;--blu:#2563eb;--pur:#7c3aed;--soft:#f1f5f9;--sh:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.06);--r:12px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1118;--fld:#0f1720;--sf:#151e29;--ink:#e8edf3;--mu:#93a1b3;--ln:#263241;--ac:#6b9bff;--ai:#0b1220;--bad:#f87171;--warn:#fbbf24;--blu:#7aa7ff;--pur:#b79cff;--soft:#1b2634;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1118;--fld:#0f1720;--sf:#151e29;--ink:#e8edf3;--mu:#93a1b3;--ln:#263241;--ac:#6b9bff;--ai:#0b1220;--bad:#f87171;--warn:#fbbf24;--blu:#7aa7ff;--pur:#b79cff;--soft:#1b2634;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:30}
main{max-width:600px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
h2{margin:0 0 14px;font-size:1.4rem;font-weight:700;letter-spacing:-.02em;line-height:1.25}
h3{margin:22px 0 8px;font-size:.72rem;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
small,.card small{color:var(--mu);display:block;font-size:.82rem;line-height:1.4}
b,strong{font-weight:600}
/* ---------- header & navigation ---------- */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sf);border-bottom:1px solid var(--ln)}
.top{display:flex;align-items:center;justify-content:space-between;max-width:600px;margin:0 auto;padding:10px 12px 6px 16px}
.brand{display:flex;align-items:center;gap:10px;font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
.mark{border-radius:9px}.logo{width:30px;height:30px;border-radius:9px;background:var(--ac);color:var(--ai);display:grid;place-items:center}
.logo svg{width:18px;height:18px}
.gear{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;color:var(--mu);text-decoration:none;border:1px solid transparent}
.gear svg{width:21px;height:21px}
.gear:hover{background:var(--soft)}
.gear[aria-current="page"]{color:var(--ac);background:var(--soft)}
.tabs{display:flex;max-width:600px;margin:0 auto;padding:0 8px}
.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--mu);font-weight:600;font-size:.7rem;letter-spacing:.01em;padding:6px 0 8px;border-bottom:2px solid transparent;transition:color .15s}
.tabs a svg{display:block;width:22px;height:22px;margin:0 auto 3px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current="page"]{color:var(--ac);border-bottom-color:var(--ac)}
/* ---------- surfaces ---------- */
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh)}
details.card{padding:14px 16px}
details{margin-top:0}
summary{cursor:pointer;color:var(--ink);font-weight:600;list-style:none;display:flex;align-items:center;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);margin:-3px 4px 0 8px;transition:transform .15s}
details[open]>summary::after{transform:rotate(-135deg);margin-top:3px}
details[open]>summary{margin-bottom:12px}
.line{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}
.line:first-child{border-top:0}
.nm{font-size:1rem;font-weight:600}
.big{font-size:1.4rem;font-weight:700;letter-spacing:-.02em}
.amt{font-size:1.05rem;font-weight:600}
.amt.owe-in{color:var(--bad)}.amt.owe-out{color:var(--ac)}.amt.zero{color:var(--mu)}
.up{color:var(--ac)}.dn,.low{color:var(--bad)}.wa{color:var(--warn)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.three button{padding:9px 4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.act-row{margin-top:10px;justify-content:flex-start}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.note{background:color-mix(in srgb,var(--warn) 10%,var(--sf));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--ln));color:var(--warn);padding:12px 14px;border-radius:var(--r);margin-bottom:12px;font-size:.9rem}
.chart{display:block}.chart text{fill:var(--mu);font-size:10px}
.back{display:inline-flex;align-items:center;margin-bottom:10px;color:var(--ac);font-weight:600;text-decoration:none}
/* ---------- forms ---------- */
input,select,textarea{font:inherit;font-size:16px;padding:10px 12px;min-height:44px;border:1px solid var(--ln);border-radius:10px;background:var(--fld);color:var(--ink);width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:var(--mu);opacity:.8}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
input[type=search]{-webkit-appearance:none;appearance:none}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;text-align:left}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;flex:none;margin:1px 0 0;accent-color:var(--ac)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.qty{display:flex;gap:6px;align-items:center}.qty input{width:60px;text-align:center;padding:8px 4px;min-height:40px}
/* ---------- buttons ---------- */
button{font:inherit;font-size:.92rem;font-weight:600;min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);cursor:pointer;box-shadow:var(--sh);transition:background .15s,border-color .15s,transform .05s}
button:hover{background:var(--soft)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.55;cursor:default}
button.p{background:var(--ac);color:var(--ai);border-color:var(--ac);width:100%;min-height:46px;font-size:.98rem}
button.p:hover{background:var(--ac);filter:brightness(.94)}
button.tp{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.pur{background:var(--pur);border-color:var(--pur);color:#fff;width:100%}
button.blu{background:var(--blu);border-color:var(--blu);color:#fff;width:100%}
button.pur:hover,button.blu:hover{filter:brightness(.94)}
button.rd{color:var(--pur);border-color:color-mix(in srgb,var(--pur) 45%,var(--ln))}
button.ad{color:var(--blu);border-color:color-mix(in srgb,var(--blu) 45%,var(--ln))}
button.del{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--ln));background:transparent;box-shadow:none;font-size:.82rem;min-height:36px;padding:6px 12px}
button.del.sm{min-height:30px;padding:3px 10px;font-size:.76rem}
button.dbtn{background:var(--bad);border-color:var(--bad);color:#fff;width:100%;min-height:46px}
.act{display:block;text-align:center;text-decoration:none;font-weight:600;font-size:.98rem;padding:13px 14px;border-radius:10px;background:var(--ac);color:var(--ai);box-shadow:var(--sh)}
.act.b,button.act.b{background:var(--sf);color:var(--ink);border:1px solid var(--ln)}
button.act{width:100%;border:0}
.fab{position:fixed;left:50%;transform:translateX(-50%);border:0;cursor:pointer;white-space:nowrap;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--ai);padding:12px 22px;border-radius:999px;font-weight:600;font-size:.95rem;text-decoration:none;box-shadow:0 8px 22px rgba(15,23,42,.25);z-index:15}
/* ---------- overlays ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;z-index:50;display:none;max-width:90%;font-size:.9rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:40;display:none;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 16px;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet,.bill{max-width:520px;margin:0 auto;border-radius:16px;padding:22px;background:var(--sf)}
.sheet{border:1px solid var(--ln);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet h2{font-size:1.2rem}
.bill{background:#fff;color:#111}
.bill table{width:100%;border-collapse:collapse}.bill th,.bill td{padding:8px 4px;border-bottom:1px solid #e5e7eb;text-align:left}
.bill .r{text-align:right}
@media print{body>*:not(#modal){display:none!important}#modal{position:static;background:none;padding:0}.noprint{display:none}}
</style>
</head>
<body>
<header id="nav"><div class="top"><b class="brand"><svg class="mark" width="30" height="30" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3476f0"/><stop offset="1" stop-color="#183aaa"/></linearGradient></defs><rect width="1024" height="1024" rx="226" fill="url(#lg)"/><g stroke="#143296" stroke-width="10" stroke-linejoin="round"><polygon points="512,565 762,700 512,835 262,700" fill="#96b9ff"/><polygon points="512,425 762,560 512,695 262,560" fill="#cddeff"/><polygon points="512,285 762,420 512,555 262,420" fill="#ffffff"/></g></svg><span>StockLedger</span></b><a class="gear" href="#settings" aria-label="Settings and my account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a></div><nav class="tabs"><a href="#home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Home</a><a href="#sale"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg>Sell</a><a href="#buy"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 7H6"/></svg>Buy</a><a href="#items"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>Stock</a><a href="#people"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/></svg>People</a></nav></header>
<main id="app"></main>
<div id="toast"></div><div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
var CFG=window.APP_CONFIG||{};
var API=(CFG.API_URL||"")+"/api/";
/* Sign-in and cloud database (MongoDB through /api): true = login and shared data. false = no login, data stays on this device. */
var USE_LOGIN=true;
var CO="Your Company Name",CUR="₹";
var prefs={theme:"light",co:"",rem:false,remDays:[3,7],remTime:"10:00"};try{Object.assign(prefs,JSON.parse(localStorage.getItem("stockapp_prefs")||"{}"))}catch(e){}
if(prefs.co)CO=prefs.co;
function savePrefs(){try{localStorage.setItem("stockapp_prefs",JSON.stringify(prefs))}catch(e){}}
function applyTheme(){var r=document.documentElement,m=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches,d=prefs.theme=="dark"||(prefs.theme=="auto"&&m);
 if(prefs.theme=="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",prefs.theme);
 var tc=document.querySelector('meta[name="theme-color"]');if(tc)tc.setAttribute("content",d?"#151e29":"#ffffff")}
applyTheme();if(window.matchMedia)try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme)}catch(e){}
var S={items:[],parties:[],docs:[],pays:[],adjs:[]},db=null,ready=0,canWrite=true,draft={sale:[],purchase:[]};
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function money(n){return (n<0?"-":"")+CUR+Math.abs(Math.round(n*100)/100).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function num(i){return parseFloat($("#"+i).value)||0}
function toast(t){var e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none"},2800)}
function find(l,id){return l.filter(function(x){return x.id==id})[0]}
function opts(l,sel){return l.map(function(x){return '<option value="'+x.id+'"'+(x.id==sel?" selected":"")+">"+esc(x.name)+"</option>"}).join("")}
function nextNo(t){var m=0;S.docs.forEach(function(d){if(d.type==t){var n=parseInt(String(d.no).slice(2),10)||0;if(n>m)m=n}});return (t=="sale"?"S-":"P-")+String(m+1).padStart(4,"0")}

/* ---- database layer: every item, party, bill and payment is one document ---- */
var _lu=0;function nowu(){_lu=Math.max(_lu+1,Date.now());return _lu}
function put(c,o){
 var i=S[c].findIndex(function(x){return x.id==o.id});if(i<0)S[c].push(o);else S[c][i]=o;
 if(!db){try{localStorage.setItem("stockapp_local",JSON.stringify(S))}catch(e){}return Promise.resolve()}
 o._u=nowu();
 return api("data",{op:"save",recs:[{coll:c,id:o.id,data:o}]}).catch(function(e){toast("Could not save: "+e.message);throw e})}
function upd(c,id,patch){var o=Object.assign({},find(S[c],id),patch);return put(c,o)}
function saveLocal(){try{localStorage.setItem("stockapp_local",JSON.stringify(S))}catch(e){}}
function rm(c,id){
 S[c]=S[c].filter(function(x){return x.id!=id});
 if(!db){saveLocal();return Promise.resolve()}
 return api("data",{op:"delete",items:[{coll:c,id:id}]}).catch(function(e){toast("Could not delete: "+e.message);refresh();throw e})}
function revStock(ds){
 var need={};ds.forEach(function(d){d.lines.forEach(function(l){need[l.itemId]=(need[l.itemId]||0)+(d.type=="sale"?l.qty:-l.qty)})});
 return Promise.all(Object.keys(need).map(function(k){var it=find(S.items,k);if(!it)return 0;return upd("items",k,{stock:it.stock+need[k]})}))}
function showDel(k,id){
 var m="",x="",o;
 if(k=="items"){o=find(S.items,id);m="Delete item <b>"+esc(o.name)+"</b>? Old bills keep their record of it, but it will no longer be in Stock."}
 else if(k=="docs"){o=find(S.docs,id);m="Delete "+(o.type=="sale"?"invoice ":"purchase bill ")+"<b>"+o.no+"</b> for "+esc(o.partyName)+" ("+money(o.total)+")? The balance of this person will change.";
  x='<label class="chk"><input type="checkbox" id="dx1"'+(o.imp?"":" checked")+'><span>Also put the stock back as it was before this bill</span></label>'}
 else if(k=="pays"){o=find(S.pays,id);m="Delete the payment of <b>"+money(o.amount)+"</b> on "+o.date+" for "+esc(o.partyName)+"? The balance of this person will change."}
 else{o=find(S.parties,id);var nb=S.docs.filter(function(d){return d.partyId==id}).length,np=S.pays.filter(function(y){return y.partyId==id}).length;
  m="Delete <b>"+esc(o.name)+"</b> ("+o.type+")? They have "+nb+" bill"+(nb==1?"":"s")+" and "+np+" payment"+(np==1?"":"s")+".";
  if(nb||np)x='<label class="chk"><input type="checkbox" id="dx1"><span>Also delete all their bills and payments. Leave this off to keep them in your sales records.</span></label>'+(nb?'<label class="chk"><input type="checkbox" id="dx2"><span>Put stock back for those bills (only when deleting bills)</span></label>':"")}
 if(!o)return;
 $("#modal").innerHTML='<div class="sheet stack"><h2 style="margin:0">Delete?</h2><div>'+m+'<small>This cannot be undone.</small></div>'+x+'<button class="dbtn" data-act="dodel" data-k="'+k+'" data-id="'+id+'">Yes, delete</button><button data-act="closem">Cancel</button></div>';
 $("#modal").style.display="block"}
async function doDel(k,id){
 var c1=$("#dx1"),y1=c1&&c1.checked,c2=$("#dx2"),y2=c2&&c2.checked;
 if(k=="docs"){var d=find(S.docs,id);if(y1)await revStock([d]);await rm("docs",id)}
 else if(k=="pays")await rm("pays",id);
 else if(k=="items"){["sale","purchase"].forEach(function(t){draft[t]=draft[t].filter(function(l){return l.itemId!=id})});await rm("items",id)}
 else{if(y1){var ds=S.docs.filter(function(d){return d.partyId==id}),ps=S.pays.filter(function(y){return y.partyId==id});
   if(y2)await revStock(ds);
   await Promise.all(ds.map(function(d){return rm("docs",d.id)}).concat(ps.map(function(y){return rm("pays",y.id)})))}
  await rm("parties",id)}
 $("#modal").style.display="none";toast("Deleted");render()}
function startLocal(){db=null;try{var t=localStorage.getItem("stockapp_local");if(t){var o=JSON.parse(t);["items","parties","docs","pays","adjs"].forEach(function(c){S[c]=o[c]||[]})}}catch(e){}ready=1;render()}
/* ---- accounts: email + password, email verification, cloud sync across devices ---- */
var VIEWAS="",cloudCfg=USE_LOGIN,A=cloudCfg?"loading":"in",user=null,OWN=true,TOK="",cur={t:0,id:""},pollT=null,polling=0,loadMsg="",loadErr="",COLS=["items","parties","docs","pays","adjs"];
function aerr(m){var e=$("#aerr");if(e){e.style.color="";e.textContent=m}}
function anote(m){var e=$("#aerr");if(e){e.style.color="var(--ac)";e.textContent=m}}
function maskEm(e){e=String(e||"");var i=e.indexOf("@");if(i<1)return "your email";return e.slice(0,Math.min(2,i))+"***"+e.slice(i)}
/* ---- Supabase backend: this replaces the old /api server. Same function, same calls, so the rest of the app is unchanged. ---- */
var SB=null;
function sbc(){
 if(SB)return SB;
 if(!window.supabase||!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY)throw new Error("Supabase is not set up. Put SUPABASE_URL and SUPABASE_ANON_KEY in config.js.");
 SB=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"stockledger-auth"}});
 return SB}
function sbMsg(e){
 var m=String(e&&e.message||e||""),c=String(e&&e.code||"");
 if(/rate.?limit|too many|security purposes/i.test(m+" "+c))return "Too many requests. Wait a few minutes and try again.";
 if(/invalid login/i.test(m))return "Wrong username or password.";
 if(/token|otp|code/i.test(m)&&/expired|invalid/i.test(m))return "That code is wrong or expired. Ask for a new one.";
 if(/already registered|already been registered/i.test(m))return "That email is already used by another account.";
 if(/database error/i.test(m))return "That username is not available.";
 if(/password/i.test(m)&&/least|weak|short/i.test(m))return "Password must be at least 6 characters.";

   if(su.data.user&&su.data.user.identities&&su.data.user.identities.length===0)throw new Error("That email is already used by another account.");
   if(su.data.session){await sb.auth.signOut();throw new Error("Email confirmation is switched off in Supabase. Turn on Confirm email so the code is sent.")}

   var s=await sbSession(),u=s.user;
   if(body===undefined){
    var q=new URLSearchParams(path.split("?")[1]||""),ct=Number(q.get("t"))||0;
    var qb=sb.from("records").select("coll,id,data,del,t").gt("t",ct).order("t",{ascending:true}).order("id",{ascending:true}).limit(1000);
    if(!ct)qb=qb.eq("del",false);
    var rd=await qb;if(rd.error)throw rd.error;
    var rows=rd.data||[],last=rows[rows.length-1];
    return {recs:rows.map(function(x){return x.del?{coll:x.coll,id:x.id,del:1}:{coll:x.coll,id:x.id,data:x.data}}),more:rows.length==1000,
     cursor:last?{t:last.t,id:last.id}:{t:ct,id:q.get("id")||""},me:sbMe(u),as:u.id}}

function prRange(){var n=new Date(),y=n.getFullYear(),m=n.getMonth(),r=PR.range;
 if(r=="month")return [iso(new Date(y,m,1)),iso(new Date(y,m+1,0))];

function prMargin(){
 if(prefs.pm!=null&&prefs.pm!==""&&!isNaN(prefs.pm))return +prefs.pm;
 var s=0,c=0;S.docs.forEach(function(d){if(d.type=="sale"&&d.lines&&d.lines.length)d.lines.forEach(function(l){if(l.cost>0){s+=l.qty*l.price;c+=l.qty*l.cost}})});

 var n=0,t=0;S.items.forEach(function(i){if(i.sell>0&&i.buy>0){t+=(i.sell-i.buy)/i.sell;n++}});
 return n?Math.round(t/n*1000)/10:0}
function prData(){
 var rg=prRange(),m=prMargin(),D={p:{},i:{},s:0,c:0,es:0,ec:0,skip:0,ss:0,m:m};
 S.docs.forEach(function(d){if(d.type!="sale"||d.date<rg[0]||d.date>rg[1])return;
  var pk=d.partyId||d.partyName,pp=function(){return D.p[pk]||(D.p[pk]={name:(find(S.parties,d.partyId)||{}).name||d.partyName,s:0,c:0,e:0,sub:{}})};
  if(!d.lines||!d.lines.length){D.skip++;D.ss+=d.total;
   if(m>0){var ec=d.total*(1-m/100),q=pp();q.s+=d.total;q.c+=ec;q.e+=d.total;D.es+=d.total;D.ec+=ec}
   return}
  var P=pp();
  d.lines.forEach(function(l){
   var rv=l.qty*l.price,cs=l.qty*(l.cost||0),ik=l.itemId||l.name,ii=D.i[ik]||(D.i[ik]={name:(find(S.items,l.itemId)||{}).name||l.name,s:0,c:0,q:0,sub:{}});

   var b=ii.sub[pk]||(ii.sub[pk]={name:P.name,s:0,c:0,q:0});b.s+=rv;b.c+=cs;b.q+=l.qty})});
 return D}

function pdfBuild(pages){

 pages.forEach(function(c,n){var po=5+n*2,co=po+1;kids.push(po+" 0 R");
  o[po]="<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents "+co+" 0 R >>";
  o[co]="<< /Length "+c.length+" >>\nstream\n"+c+"\nendstream"});
 o[2]="<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+pages.length+" >>";
 for(i=1;i<o.length;i++){off[i]=out.length;out+=i+" 0 obj\n"+o[i]+"\nendobj\n"}
 var x=out.length;out+="xref\n0 "+o.length+"\n0000000000 65535 f \n";
 for(i=1;i<o.length;i++)out+=String(off[i]).padStart(10,"0")+" 00000 n \n";

 else if(a=="sendwa"){var wd=find(S.docs,id);if(!wd)return;var wp=find(S.parties,wd.partyId),wn=waNum(wp&&wp.phone);if(!wn){showWaAsk(wd,wp);return}waOpen(wn,waText(wd))}

 else if(a=="saveph"){b.disabled=true;await upd("parties",id,{phone:($("#eph").value||"").trim()});$("#modal").style.display="none";toast("Mobile number saved");render()}
 else if(a=="askreset"){if(!canWrite)return toast("View only: you cannot change data");
  $("#modal").innerHTML='<div class="sheet stack"><h2 style="margin:0">Erase everything?</h2><div>This permanently deletes <b>'+S.items.length+'</b> items, <b>'+S.parties.length+'</b> customers and suppliers, <b>'+S.docs.length+'</b> bills, <b>'+S.pays.length+'</b> payments and the stock history'+(db?" from your account on every device":" from this device")+'. Your company name and theme on this device also go back to the defaults.<small>This cannot be undone.</small></div><label class="chk"><input type="checkbox" id="rsb"><span>Download a backup file first (recommended)</span></label><div><small>Type ERASE to confirm</small><input id="rsc" autocomplete="off" autocapitalize="characters" placeholder="ERASE"></div><button class="dbtn" data-act="doreset">Erase everything</button><button data-act="closem">Cancel</button></div>';$("#modal").style.display="block"}
 else if(a=="doreset"){if($("#rsc").value.trim().toUpperCase()!="ERASE")return toast("Type ERASE to confirm");

  if(db){try{await api("data",{op:"erase"})}catch(e){toast("Could not erase: "+e.message);throw e}}
  COLS.forEach(function(c){S[c]=[]});draft={sale:[],purchase:[]};selP="";selItem="";openP={};

 else if(a=="impback"){IMP.step=0;impShow()}

 }catch(err){if(b)b.disabled=false}

["items","parties","docs","pays","adjs"].forEach(function(c){S[c]=o[c]||[]});localStorage.setItem("stockapp_local",JSON.stringify(S));render();toast("Backup restored")}catch(x){toast("That file could not be read")}};r.readAsText(e.target.files[0])});
